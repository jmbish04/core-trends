name: "Monolith: Repository Intelligence Pipeline"

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:      # Allow manual triggers

jobs:
  ingest-trending-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch trending repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          API_ENDPOINT: ${{ secrets.WORKER_API_ENDPOINT }}
        run: |
          node <<'EOF'
          const https = require('https');
          const fs = require('fs');

          console.log('🚀 Starting Monolith Repository Intelligence Pipeline...');

          // Fetch trending repositories from GitHub
          async function fetchTrendingRepos() {
            const query = 'stars:>1000 created:>2024-01-01';
            const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=stars&order=desc&per_page=50`;

            return new Promise((resolve, reject) => {
              const options = {
                headers: {
                  'User-Agent': 'Monolith-Intelligence-Engine',
                  'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                  'Accept': 'application/vnd.github.v3+json'
                }
              };

              https.get(url, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    resolve(JSON.parse(data));
                  } else {
                    reject(new Error(`GitHub API error: ${res.statusCode}`));
                  }
                });
              }).on('error', reject);
            });
          }

          // Send repository data to Worker API
          async function sendToWorker(repos) {
            const apiEndpoint = process.env.API_ENDPOINT || 'http://localhost:8787/api/repositories';

            for (const repo of repos.items.slice(0, 10)) {
              const repoData = {
                githubId: repo.id,
                name: repo.name,
                owner: repo.owner.login,
                fullName: repo.full_name,
                description: repo.description,
                url: repo.html_url,
                language: repo.language,
                stars: repo.stargazers_count,
                trendPeriod: 'daily',
                discoveredMethod: 'pipeline_trending'
              };

              console.log(`📦 Processing: ${repo.full_name} (⭐ ${repo.stargazers_count})`);

              const postData = JSON.stringify(repoData);
              const urlObj = new URL(apiEndpoint);

              const options = {
                hostname: urlObj.hostname,
                port: urlObj.port || 443,
                path: urlObj.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(postData)
                }
              };

              await new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    console.log(`  ✅ Sent to API (${res.statusCode})`);
                    resolve();
                  });
                });
                req.on('error', (e) => {
                  console.error(`  ❌ Error: ${e.message}`);
                  resolve(); // Continue with next repo
                });
                req.write(postData);
                req.end();
              });

              // Rate limiting: wait 1 second between requests
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          }

          // Main execution
          (async () => {
            try {
              const trendingData = await fetchTrendingRepos();
              console.log(`\n📊 Found ${trendingData.items.length} trending repositories`);

              await sendToWorker(trendingData);

              console.log('\n✨ Pipeline completed successfully!');
            } catch (error) {
              console.error('❌ Pipeline failed:', error.message);
              process.exit(1);
            }
          })();
          EOF

      - name: Generate migrations
        run: npm run db:generate

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          cp .assetsignore dist/.assetsignore || true
          npx wrangler deploy
